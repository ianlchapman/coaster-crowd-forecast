[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coaster-crowd-forecast"
version = "0.1.0"
description = "Forecast theme-park crowd levels (crowd_percent) from calendars, holidays, weather and recent history."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.11",
  "scikit-learn>=1.4",
  "lightgbm>=4.3",
  "joblib>=1.3",
  "pyyaml>=6",
  "holidays>=0.50",
  "python-dateutil>=2.9",
  "pycountry>=23",
  "shapely>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pandas-stubs", "types-PyYAML"]

[project.scripts]
crowdcast = "crowdcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
crowdcast = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PD"]
ignore = [
  "PD011",   # .values is used deliberately for numpy interop
  "E501",    # line length is enforced by the formatter where possible
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
# Hand-curated data scripts ported from the research phase (term dates, holiday rules). They are formatted but not lint-clean by
# design: rewriting hundreds of lines of curated data tables for style would risk changing the data. Outputs are regression-checked.
"scripts/calendars/*" = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "NPY", "PD"]

[tool.mypy]
files = ["src/crowdcast"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
no_implicit_optional = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["network: needs internet access (skipped by default)", "realdata: needs the real loader data under data/raw/"]
